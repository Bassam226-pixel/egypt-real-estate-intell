# docker-compose.yml
# Egypt Real Estate Intelligence — S3 storage + Jupyter/local-mode Spark + Dremio
# Core:        docker compose up -d nessie jupyter dremio
# With RAG:    docker compose --profile rag up -d
# With app:    docker compose --profile app up -d
#
# NOTE: create the S3 bucket in AWS FIRST (e.g. aws s3 mb s3://your-bucket). Compose does not create it.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow # airflow + java + pyspark (local mode)
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    PYTHONPATH: /opt/project
    SPARK_MASTER: "local[*]"
    NESSIE_URI: http://nessie:19120/api/v2
    WAREHOUSE: ${WAREHOUSE}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_REGION: ${AWS_REGION}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./spark_jobs:/opt/project/spark_jobs
    - ./ingestion:/opt/project/ingestion
    - ./engine:/opt/project/engine
    - ./data:/opt/project/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: [ "5432:5432" ]
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: [ "6379:6379" ]
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]

  # ---------- Dedicated Postgres for Nessie's catalog metadata (JDBC2 version store) ----------
  nessie-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessie
      POSTGRES_DB: nessie
    volumes:
      - nessie_pgdata:/var/lib/postgresql/data
    ports: [ "5433:5432" ]  # host 5433 to avoid clashing with the airflow postgres on 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nessie" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Iceberg catalog (versioned). Data lives on S3; Nessie stores pointers only. ----------
  nessie:
    image: ghcr.io/projectnessie/nessie:0.99.0
    ports: [ "19120:19120" ]
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC2
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://nessie-postgres:5432/nessie
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: nessie
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: nessie
    depends_on:
      nessie-postgres:
        condition: service_healthy

  # ---------- Spark via Jupyter (local mode) ----------
  jupyter:
    # Pinned (not :latest): :latest currently resolves to Spark 4.1.2, for which
    # Nessie has no released nessie-spark-extensions build (max is Spark 3.5 as of
    # nessie-spark-extensions-3.5_2.12:0.108.3 / iceberg-spark-runtime-3.5_2.12:1.11.0).
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.3
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-egypt}
      SPARK_MASTER: "local[*]"
      NESSIE_URI: http://nessie:19120/api/v2
      WAREHOUSE: ${WAREHOUSE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      # Base image exposes pyspark via PYTHONPATH (not pip-installed) - must append, not replace.
      PYTHONPATH: /usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.7-src.zip:/home/jovyan/work
    ports: [ "8888:8888" ]
    volumes:
      - ./:/home/jovyan/work
    depends_on: [ nessie ]

  # ---------- Dremio (SQL serving engine; add Nessie source once — see DREMIO_SETUP.md) ----------
  dremio:
    image: dremio/dremio-oss:latest
    ports:
      - "9047:9047"
      - "31010:31010"
      - "32010:32010"
    environment:
      DREMIO_MAX_MEMORY_SIZE_MB: "4096"
    volumes:
      - dremio_data:/opt/dremio/data
    depends_on: [ nessie ]

  # ---------- Airflow ----------
  airflow-init:
    <<: *airflow-common
    entrypoint: >
      /bin/bash -c " airflow db migrate && airflow users create --username admin --password admin
        --firstname admin --lastname admin --role Admin --email admin@example.com || true
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: [ "8082:8080" ]
    depends_on:
      postgres: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # ---------- RAG (optional) ----------
  chromadb:
    image: chromadb/chroma:latest
    profiles: [ "rag" ]
    ports: [ "8003:8000" ]
    environment:
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma_data:/chroma/chroma

  # ---------- Application (optional) ----------
  api:
    build: ./api
    profiles: [ "app" ]
    env_file: .env
    environment:
      NESSIE_URI: http://nessie:19120/api/v2
      WAREHOUSE: ${WAREHOUSE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      REDIS_URL: redis://redis:6379/0
      CHROMA_URL: http://chromadb:8000
      DREMIO_FLIGHT_URI: grpc+tcp://dremio:32010
      DREMIO_USER: ${DREMIO_USER:-admin}
      DREMIO_PASSWORD: ${DREMIO_PASSWORD:-admin123}
    ports: [ "8000:8000" ]
    depends_on: [ nessie, redis, dremio ]

  frontend:
    build: ./frontend
    profiles: [ "app" ]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: [ "3000:3000" ]
    depends_on: [ api ]

volumes:
  postgres_data:
  nessie_pgdata:
  chroma_data:
  dremio_data: